site_name: DFIQ (Digital Forensics Investigative Questions)
repo_url: https://github.com/google/dfiq
theme:
  name: material
  favicon: assets/dfiq-square.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
  logo: assets/dfiq.png
  palette:
    primary: custom
    accent: custom
  font:
    text: Ubuntu
plugins:
  - search
  - tags:
      tags_file: tags.md
  - redirects:
      redirect_maps:
        'spec.md': 'contributing/specification.md'
markdown_extensions:
  - pymdownx.betterem
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - toc:
      toc_depth: 2-3
  - def_list
  - attr_list
extra:
  generator: false
extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Tags: tags.md
  - Contributing:
      - Approach Glossary: contributing/approach_glossary.md
      - DFIQ Specifications:
          - latest (1.1.0): contributing/specification.md
          - 1.0.1: contributing/specification_1_0_1.md
  - Questions:
      - questions/index.md
      - questions/Q1001.md
      - questions/Q1018.md
      - questions/Q1019.md
      - questions/Q1020.md
      - questions/Q1024.md
      - questions/Q1036.md
      - questions/Q1037.md
      - questions/Q1074.md
  - Scenarios:
      - scenarios/index.md
      - scenarios/S1001.md
      - scenarios/S1002.md
      - scenarios/S1003.md
      - scenarios/S1005.md
      - scenarios/S1007.md
      - scenarios/S1008.md
