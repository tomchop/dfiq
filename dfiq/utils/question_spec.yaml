---
name: str()
type: enum('question')
description: str(required=False)
id: regex('^Q\d{4}$', required=False)
uuid: regex('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
internal: bool(required=False)
dfiq_version: regex('\d{1,2}\.\d{1,2}\.\d{1,2}')
tags: list(str(), required=False)
contributors: list(str(), required=False)
parent_ids: list(regex('^[FS]\d{4}$|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'))
approaches: list(include('approach'), required=False)
---
approach:
  name: str()
  description: str(required=False)
  tags: list(str(), required=False)
  references: list(str(), required=False)
  references_internal: list(str(), required=False)
  notes: include('notes', required=False)
  steps: list(include('step'))
notes:
  covered: list(str(), required=False)
  not_covered: list(str(), required=False)
step:
  name: str()
  description: str(required=False)
  stage: enum('collection', 'processing', 'analysis')
  type: str()
  value: str()
